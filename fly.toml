app = "l2-concept"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  # Enforce the API_KEY guard regardless of what the connection looks like. Behind
  # fly-proxy the request does not arrive on loopback today, but the guard should not
  # depend on that staying true — see server/env.ts.
  REQUIRE_API_KEY = "1"

# One small volume, and therefore ONE machine.
#
# A Fly volume attaches to a single machine. With the two this app had, requests landed on
# either and half the analytics would have been written to a machine with no volume — or,
# with a volume each, split into two halves neither of which is the answer. `count = 1`
# below is what makes a single volume correct rather than a data-loss bug.
#
# The trade is that a deploy is briefly a full outage instead of rolling. For a demo that
# is idle most of the time and cold-starts in a couple of seconds anyway, that is nothing.
[mounts]
  source = "analytics"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Zero, deliberately. This is a demo that is idle most of the time, and a cold start is
  # a couple of seconds against a 30 MB image. Paying for an always-on machine to save
  # that is the wrong trade.
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  # The server streams files and shells out to nothing; the work is all in the OpenAI
  # call, which is spent waiting on the network. 512 MB is comfortable for that plus the
  # Node baseline.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  # One machine, because one volume — see the [mounts] note above.
  count = 1
