<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Workvivo mobile — live replay</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#E30613;font-family:-apple-system,"SF Pro Text","SF Pro Display",
       "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;
       display:flex;justify-content:center;padding:40px 20px}
  .sprite{position:absolute;width:0;height:0;overflow:hidden}

  .phone{width:393px;height:852px;border-radius:52px;background:#F04A55;padding:7px}
  .screen{width:100%;height:100%;border-radius:45px;overflow:hidden;background:#000;
          position:relative;display:flex;flex-direction:column}

  /* status bar (host OS chrome — approximated) */
  .status{height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;
          padding:0 28px 6px;color:#fff}
  .time{font-size:16px;font-weight:590;letter-spacing:.2px}
  .sysico{display:flex;align-items:center;gap:7px}
  .sysico svg{display:block}

  /* header */
  .head{flex:none;padding:6px 16px 16px;display:flex;align-items:center;gap:10px;color:#fff}
  .back{width:12px;height:12px;border-left:2.4px solid #fff;border-bottom:2.4px solid #fff;
        transform:rotate(45deg);flex:none;margin-right:4px;cursor:pointer}
  .htx{flex:1}
  .pill{display:inline-flex;align-items:center;height:28px;padding:0 14px;border-radius:15px;
        background:#EDE3FD;color:#6103ED;font-size:14px;font-weight:700;letter-spacing:.4px}
  .htx h1{font-size:19px;font-weight:590;margin-top:8px;white-space:nowrap}
  .hacts{display:flex;align-items:center;gap:16px;flex:none;align-self:flex-end;
         padding-bottom:2px}
  .ic{cursor:pointer;color:#fff}

  /* geometric stand-ins — not Workvivo library art */
  .g-mute{width:26px;height:24px;position:relative;display:block}
  .g-mute .cone{position:absolute;left:1px;top:8px;width:7px;height:8px;background:#fff;
                border-radius:1px}
  .g-mute .cone:after{content:"";position:absolute;left:6px;top:-5px;
                      border-left:9px solid #fff;border-top:9px solid transparent;
                      border-bottom:9px solid transparent}
  .g-mute .slash{position:absolute;left:-1px;top:11px;width:28px;height:2px;background:#fff;
                 transform:rotate(-40deg);border-radius:2px}
  .g-rot{width:26px;height:26px;position:relative;display:block}
  .g-rot .sq{position:absolute;left:4px;top:4px;width:18px;height:18px;border:2.2px solid #fff;
             border-radius:5px;transform:rotate(40deg)}
  .g-rot .arc{position:absolute;left:2px;top:2px;width:22px;height:22px;border:2.2px solid #fff;
              border-radius:50%;border-top-color:transparent;border-right-color:transparent}

  /* video */
  .video{flex:1;min-height:0;
         background:linear-gradient(155deg,#9C7B54 0%,#6B4E32 30%,#3A2C1E 62%,#1E1710 100%)}
  .video:before{content:"";display:block;height:100%;
        background:linear-gradient(90deg,rgba(255,255,255,.06) 0 3px,transparent 3px 74px)}

  /* chapters sheet */
  .sheet{flex:none;background:#1B1B1D;padding:22px 16px 26px;max-height:440px;overflow-y:auto}
  .sheet::-webkit-scrollbar{width:0}
  .shead{display:flex;align-items:center;margin-bottom:22px}
  .shead h2{font-size:23px;font-weight:590;color:#fff}
  .xbtn{margin-left:auto;width:46px;height:46px;border-radius:50%;background:#333336;
        display:flex;align-items:center;justify-content:center;cursor:pointer}
  .g-x{width:19px;height:19px;position:relative}
  .g-x i{position:absolute;left:0;top:8.4px;width:19px;height:2.2px;background:#E8E9EB;
         border-radius:2px;display:block}
  .g-x i:nth-child(1){transform:rotate(45deg)}
  .g-x i:nth-child(2){transform:rotate(-45deg)}

  .chap{display:flex;align-items:center;gap:14px;padding:12px;border-radius:10px;cursor:pointer}
  .chap.on{background:#303032}
  .thumb{width:116px;height:78px;border-radius:6px;flex:none;display:block}
  .ctx{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
  .cttl{font-size:17px;line-height:23px;white-space:nowrap;font-weight:400;color:#fff}
  .tstamp{background:#3A3A3D;color:#fff;font-size:16px;font-weight:500;border-radius:8px;
          padding:5px 12px}
  .pick{width:40px;height:40px;border-radius:50%;background:#8E8E93;
        border:2.5px solid #D6D6DA;flex:none}
</style>
<script>
  /* ?transparent=1 drops the #E30613 page fill so the frame can be composited over
     whatever is behind the iframe — used by LivestreamScene.tsx, which rises this over
     the brand green instead of the red baked in here. */
  if (new URLSearchParams(location.search).get('transparent') === '1') {
    var s = document.createElement('style');
    s.textContent = 'html,body{background:transparent}';
    document.head.appendChild(s);
  }
</script></head>

    <div class="sysico">
